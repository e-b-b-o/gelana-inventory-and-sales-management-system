# Render Blueprint Specification for Gelana API
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: gelana-api
    runtime: node
    plan: free
    region: ohio
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ALLOW_DEMO_SEED
        value: "true"
